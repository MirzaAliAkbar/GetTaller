name: gettaller_app
description: "GetTaller - Your 90-Day Growth Journey. 100% free, ad-supported height optimization app."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_crashlytics: ^4.0.1
  firebase_analytics: ^11.3.0
  firebase_remote_config: ^5.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Ads
  google_mobile_ads: ^5.3.1

  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  http: ^1.2.2

  # Charts
  fl_chart: ^0.69.2

  # PDF & Sharing
  pdf: ^3.11.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2D0A5E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/exercises/
    - assets/exercises/
