plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.grayonix.GetTaller"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            keyAlias 'gettaller'
            keyPassword 'gettaller123'
            storeFile file('release-key.jks')
            storePassword 'gettaller123'
        }
    }

    defaultConfig {
        applicationId = "com.grayonix.GetTaller"
        minSdk = 24
        targetSdk = 36  // Android 16 (API 36) — Google Play requirement
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false  // Disabled: was stripping notification resources despite ProGuard rules
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'

    // AdMob mediation adapters — resolved natively by the Google Mobile Ads SDK
    // per the mediation groups configured in the AdMob console.
    implementation 'com.google.ads.mediation:applovin:13.6.3.0'
    implementation 'com.unity3d.ads:unity-ads:4.19.0'
    implementation 'com.google.ads.mediation:unity:4.19.0.0'
}
